services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencode
    ports:
      - "5001:5001"
    volumes:
      - .:/workspace
      - opencode-data:/root/.local/share/opencode
      - opencode-config:/root/.config/opencode
    working_dir: /workspace
    environment:
      # --- Kredensial Login Browser ---
      OPENCODE_SERVER_USERNAME: "${OPENCODE_SERVER_USERNAME}"
      OPENCODE_SERVER_PASSWORD: "${OPENCODE_SERVER_PASSWORD}"
      
      # --- Provider API Key ---
      OPENCODE_API_KEY: "${OPENCODE_API_KEY}"
      # OPENAI_API_KEY: "${OPENCODE_API_KEY}"
      # OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}"
      
      # Model ditentukan via Environment Variable
      OPENCODE_MODEL: "big-pickle"
    # Dihapus --model dari command agar tidak menolak startup
    command: opencode serve --hostname 0.0.0.0 --port 5001
    restart: unless-stopped


  # ── PostgreSQL (shared untuk portal & POS) ──
  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-aicoding}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./project/aicoding/Database:/docker-entrypoint-initdb.d
    restart: unless-stopped

